<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viento vs RONI</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="datos.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; margin-bottom: .8rem; }
  .controles { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-bottom: .5rem; }
  label { font-size: .9rem; }
  select { font-size: .95rem; padding: .25rem .4rem; margin-left: .3rem; }
  #stats { font-size: .9rem; color: #444; margin: .3rem 0; }
  #grafico { width: 100%; height: 360px; }
  #series { width: 100%; height: 440px; }
  .volver { font-size: .85rem; margin: 0 0 .3rem; }
  .ayuda { font-size: .8rem; color: #777; margin: .2rem 0 0; }
</style>
</head>
<body>
<p class="volver"><a href="../index.html">← Inicio</a></p>
<h1>Viento (MERRA) vs RONI</h1>
<div class="controles">
  <label>Sitio <select id="sitio"></select></label>
  <label>Trimestre <select id="estacion"></select></label>
</div>
<div id="stats"></div>
<div id="grafico"></div>
<p class="ayuda">Clic en un punto para señalarlo en la serie del RONI; clic en las series de abajo para ver ese trimestre y año arriba.</p>
<div id="series"></div>

<script>
const TRIM = ["DJF", "JFM", "FMA", "MAM", "AMJ", "MJJ", "JJA", "JAS", "ASO", "SON", "OND", "NDJ"];

function opciones(sel, valores, etiqueta) {
  const g = etiqueta ? document.createElement("optgroup") : sel;
  if (etiqueta) { g.label = etiqueta; sel.appendChild(g); }
  valores.forEach(v => g.appendChild(new Option(v, v)));
}

function regresion(x, y) {
  const n = x.length, mx = x.reduce((a, b) => a + b) / n, my = y.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2;
  }
  const m = sxy / sxx;
  return { m, b: my - m * mx, r: sxy / Math.sqrt(sxx * syy), n };
}

const AZUL = "#2c5fbf", ROJO = "#c0392b", GRIS = "#888";
const colorRoni = v => v <= -0.5 ? AZUL : v >= 0.5 ? ROJO : GRIS;

{
  const D = DATOS;
  const selSitio = document.getElementById("sitio"), selEst = document.getElementById("estacion");
  const grupos = {};
  Object.entries(D.series).forEach(([k, S]) => (grupos[S.grupo] ??= []).push(k));
  Object.entries(grupos).forEach(([g, ks]) => opciones(selSitio, ks, g));
  opciones(selEst, TRIM);
  let marcado = null;  // año señalado

  function dibujar() {
    const sitio = selSitio.value, est = selEst.value, S = D.series[sitio];
    const x = [], y = [], anio = [];
    D.anios.forEach((a, i) => {
      const xi = D.roni[est][i], yi = S[est][i];
      if (xi !== null && yi !== null) { x.push(xi); y.push(yi); anio.push(a); }
    });
    const R = regresion(x, y);
    const xr = [-2.5, 2.5];

    document.getElementById("stats").textContent =
      `r = ${R.r.toFixed(3)} · R² = ${(R.r ** 2).toFixed(3)} · y = ${R.m.toFixed(3)}x + ${R.b.toFixed(3)} · n = ${R.n}`;

    const k = anio.indexOf(marcado);
    Plotly.react("grafico", [
      { x, y, customdata: anio, mode: "markers", type: "scatter",
        marker: { size: 9, color: x.map(colorRoni), opacity: 0.75, line: { width: 0.5, color: "#fff" } },
        hovertemplate: `<b>%{customdata}</b><br>RONI: %{x:.2f} °C<br>Viento: %{y:.2f} ${S.unidad}<extra></extra>` },
      { x: xr, y: xr.map(v => R.m * v + R.b), mode: "lines", type: "scatter",
        line: { color: "#000", width: 1.5 }, hoverinfo: "skip" },
      { x: k < 0 ? [] : [x[k]], y: k < 0 ? [] : [y[k]], mode: "markers", type: "scatter", hoverinfo: "skip",
        marker: { size: 16, color: "rgba(0,0,0,0)", line: { width: 2, color: "#000" } } },
    ], {
      margin: { t: 10, r: 20, b: 45, l: 65 },
      showlegend: false,
      xaxis: { title: "RONI [°C]", range: xr, zeroline: false },
      yaxis: { title: `${sitio} ${est} [${S.unidad}]`, zeroline: false },
      shapes: [
        { type: "rect", xref: "x", yref: "paper", x0: -2.5, x1: -0.5, y0: 0, y1: 1,
          fillcolor: "rgba(60,90,255,0.12)", line: { width: 0 }, layer: "below" },
        { type: "rect", xref: "x", yref: "paper", x0: 0.5, x1: 2.5, y0: 0, y1: 1,
          fillcolor: "rgba(220,50,40,0.10)", line: { width: 0 }, layer: "below" },
      ],
      annotations: [
        { x: -1.5, y: 0.04, xref: "x", yref: "paper", text: "Niña", showarrow: false, font: { color: AZUL, size: 14 } },
        { x: 1.5, y: 0.04, xref: "x", yref: "paper", text: "Niño", showarrow: false, font: { color: ROJO, size: 14 } },
      ],
    }, { responsive: true, displaylogo: false });

    // Series completas (RONI arriba, viento del sitio abajo) en una figura con eje x compartido.
    // Cada valor es un trimestre móvil ubicado en su mes central.
    const fecha = (a, m) => `${a}-${String(m + 1).padStart(2, "0")}-15`;
    const iso = d => d.toISOString().slice(0, 10);
    const completa = arr => {
      const fx = [], fy = [], fd = [];
      D.anios.forEach((a, i) => TRIM.forEach((t, m) => {
        const v = arr[t][i];
        if (v !== null) { fx.push(fecha(a, m)); fy.push(v); fd.push([a, t]); }
      }));
      return { fx, fy, fd };
    };
    const cr = completa(D.roni), cv = completa(S);

    // Franja verde de 3 meses sobre el trimestre marcado, cruzando ambos paneles
    const marca = [], textos = [];
    if (marcado !== null) {
      const m = TRIM.indexOf(est);  // 0 = DJF (centrado en enero)
      const x0 = iso(new Date(Date.UTC(marcado, m - 1, 1))), x1 = iso(new Date(Date.UTC(marcado, m + 2, 1)));
      marca.push({ type: "rect", xref: "x", yref: "paper", x0, x1, y0: 0, y1: 1,
                   fillcolor: "rgba(80,200,80,0.25)", line: { width: 0 }, layer: "below" });
      const k = D.anios.indexOf(marcado), v = k < 0 ? null : D.roni[est][k];
      textos.push({ x: fecha(marcado, m), xref: "x", y: 0.5, yref: "paper", showarrow: false,
                    text: `<b>${est} ${marcado}</b>` + (v === null ? "" : ` (${v.toFixed(2)} °C)`),
                    font: { size: 12 }, bgcolor: "rgba(255,255,255,0.85)" });
    }

    Plotly.react("series", [
      { x: cr.fx, y: cr.fy, customdata: cr.fd, type: "bar", marker: { color: cr.fy.map(colorRoni) },
        hovertemplate: `<b>%{customdata[1]} %{customdata[0]}</b><br>RONI: %{y:.2f} °C<extra></extra>` },
      { x: cv.fx, y: cv.fy, customdata: cv.fd, type: "scatter", mode: "lines", yaxis: "y2",
        line: { color: "#333", width: 1.2 },
        hovertemplate: `<b>%{customdata[1]} %{customdata[0]}</b><br>Viento: %{y:.2f} ${S.unidad}<extra></extra>` },
    ], {
      margin: { t: 10, r: 20, b: 30, l: 65 }, showlegend: false, uirevision: "zoom", bargap: 0,
      xaxis: { type: "date", anchor: "y2",
               range: [`${D.anios[0] - 1}-12-01`, `${D.anios.at(-1)}-12-31`] },
      yaxis: { domain: [0.56, 1], title: "RONI [°C]", zeroline: true },
      yaxis2: { domain: [0, 0.44], title: `${sitio} [${S.unidad}]`, zeroline: false },
      shapes: [...marca, ...[-0.5, 0.5].map(u => ({ type: "line", xref: "paper", x0: 0, x1: 1, yref: "y",
        y0: u, y1: u, line: { color: u < 0 ? AZUL : ROJO, width: 1, dash: "dot" } }))],
      annotations: textos,
    }, { responsive: true, displaylogo: false });
  }

  selSitio.onchange = selEst.onchange = dibujar;
  dibujar();
  const g = document.getElementById("grafico");
  g.on("plotly_click", ev => {
    const p = ev.points.find(p => p.curveNumber === 0);
    if (!p) return;
    marcado = marcado === p.customdata ? null : p.customdata;  // segundo clic desmarca
    dibujar();
  });
  // Clic en las series: pasa arriba al trimestre de ese valor y marca el año
  document.getElementById("series").on("plotly_click", ev => {
    const [a, t] = ev.points[0].customdata;
    if (a === marcado && t === selEst.value) marcado = null;
    else { marcado = a; selEst.value = t; }
    dibujar();
  });
}
</script>
</body>
</html>
